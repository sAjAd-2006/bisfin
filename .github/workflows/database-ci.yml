name: Database CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    name: PostgreSQL 16 migrations and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: bisfin_ci
      POSTGRES_DB: bisfin_ci
      POSTGRES_USER: bisfin_ci
      POSTGRES_PASSWORD: bisfin_ci_ephemeral_password
      POSTGRES_PORT: 55432
      DB_WAIT_ATTEMPTS: 60
      DB_WAIT_INTERVAL_SECONDS: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Ensure an empty PostgreSQL state
        run: docker compose down --volumes --remove-orphans

      - name: Start PostgreSQL 16
        run: make db-up

      - name: Wait for PostgreSQL
        run: make db-wait

      - name: Apply migrations
        run: make db-migrate

      - name: Verify idempotency and run smoke tests
        run: make db-test

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
