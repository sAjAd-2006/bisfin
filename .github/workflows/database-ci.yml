name: Database CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    name: PostgreSQL 16 and Alembic verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: bisfin_ci
      BISFIN_ENV: ci
      BISFIN_LOG_LEVEL: INFO
      BISFIN_LOG_FORMAT: console
      POSTGRES_DB: bisfin_ci
      POSTGRES_USER: bisfin_ci
      POSTGRES_PASSWORD: bisfin_ci_ephemeral_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 5
      DATABASE_POOL_TIMEOUT_SECONDS: 30
      DATABASE_STATEMENT_TIMEOUT_MS: 30000
      DATABASE_APPLICATION_NAME: bisfin-ci
      DB_WAIT_ATTEMPTS: 60
      DB_WAIT_INTERVAL_SECONDS: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked Python dependencies
        run: uv sync --locked --dev

      - name: Verify dependency lock
        run: uv lock --check

      - name: Run Python lint checks
        run: make python-lint

      - name: Check Python formatting
        run: make python-format-check

      - name: Run Python unit tests
        run: make python-test

      - name: Run focused BrsApi fixture unit tests
        run: make brsapi-test

      - name: Run catalog and calendar unit tests
        run: |
          make catalog-test
          make calendar-test

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Ensure an empty PostgreSQL state
        run: docker compose down --volumes --remove-orphans

      - name: Start PostgreSQL 16
        run: make db-up

      - name: Wait for PostgreSQL
        run: make db-wait

      - name: Validate migration files, checksums, and Alembic history
        run: uv run --frozen python -m scripts.db.check_migrations

      - name: Apply Alembic migrations to an empty database
        run: make db-migrate

      - name: Verify a second Alembic upgrade is a no-op
        run: make db-migrate

      - name: Show the current Alembic revision
        run: make migration-current

      - name: Verify the Alembic head and migration registry
        run: make migration-check

      - name: Verify raw SQL idempotency and run smoke tests
        run: make db-test

      - name: Run PIT integration and concurrency tests
        env:
          BISFIN_RUN_DB_INTEGRATION: "1"
        run: make db-test-pit

      - name: Run Python database integration tests
        env:
          BISFIN_RUN_DB_INTEGRATION: "1"
        run: make python-test-integration

      - name: Run BrsApi ingestion integration tests
        env:
          BISFIN_RUN_DB_INTEGRATION: "1"
        run: make brsapi-test-integration

      - name: Run deterministic catalog, calendar, and daily-bar fixture flow
        env:
          BISFIN_RUN_DB_INTEGRATION: "1"
        run: |
          make catalog-validate-fixture
          make catalog-bootstrap-fixture
          make calendar-validate-fixture
          make calendar-import-fixture
          make bootstrap-e2e-fixture

      - name: Run fixture-backed BrsApi CLI end to end
        env:
          BISFIN_RUN_DB_INTEGRATION: "1"
        run: >-
          uv run --frozen pytest -m integration
          tests/integration/test_brsapi_ingestion.py::test_cli_fixture_mode_end_to_end

      - name: Validate application configuration
        run: make app-config-check

      - name: Verify application database health
        run: make app-db-health

      - name: Verify application database revision
        run: make app-db-current

      - name: Reset the database and repeat migrations and tests
        run: make db-reset

      - name: Verify the reset database, application health, and PIT integration
        env:
          BISFIN_RUN_DB_INTEGRATION: "1"
        run: |
          make migration-current
          make migration-check
          make app-db-health
          make app-db-current
          make db-test-pit
          make python-test-integration
          make brsapi-test-integration
          make bootstrap-e2e-fixture
          uv run --frozen pytest -m integration tests/integration/test_brsapi_ingestion.py::test_cli_fixture_mode_end_to_end

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
