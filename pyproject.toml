[project]
name = "bisfin-database"
version = "0.1.0"
description = "Database migration and verification tooling for Bisfin."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17.1,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.uv]
package = false
required-version = "==0.11.32"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
pretty = true
show_error_codes = true
warn_unused_configs = true
exclude = ["^\\.venv/"]
